name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Model retrain + accuracy gate
        run: python train.py --out /tmp/models_ci.pkl --metrics /tmp/metrics.json --min-accuracy 0.85

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t coach:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: coach:ci
          version: v0.69.3
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Container smoke test
        run: |
          docker run -d --name coach -p 8000:8000 -e SECRET_KEY=ci-secret coach:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 3
          done
          docker logs coach
          exit 1
